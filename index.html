<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Drive Workspace（個人用）</title><style>body{font:16px/1.8 system-ui;max-width:760px;margin:60px auto;padding:0 24px;color:#24313a}h1{font-size:28px}a{color:#165cb3}</style><main><h1>Codex Drive Workspace（個人用）</h1><p>Google Driveの所有者本人が、ChatGPT WorkおよびCodex Cloudから、指示したファイルの検索・読取・作成・編集を行うための個人用接続です。一般向けサービスとして提供していません。</p><p>Googleの同意画面で許可されたDriveアクセスを使います。公開ページには、認証情報やDriveのファイルを掲載しません。</p><p><a href="privacy.html">プライバシーポリシー</a></p><p>管理者・問い合わせ先: <a href="https://github.com/edgerunner3104-beep/cloud-workspace-info/issues">GitHub Issues</a>（個人情報や認証情報を投稿しないでください）</p><p>更新日: 2026年10月3日</p></main></html>
